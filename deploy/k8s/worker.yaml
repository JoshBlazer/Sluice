apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluice-worker
  namespace: sluice
  labels:
    app: sluice-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sluice-worker
  template:
    metadata:
      labels:
        app: sluice-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: sluice:latest
          args: ["--role", "worker", "--shutdown-timeout", "45s", "--concurrency", "10"]
          envFrom:
            - configMapRef:
                name: sluice-config
            - secretRef:
                name: sluice-secrets
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
---
# KEDA ScaledObject - scales worker replicas on total Redis queue depth, read
# from the sluice_queue_depth gauge the scheduler leader exports.
# Requires KEDA (https://keda.sh) and a Prometheus that scrapes the scheduler.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sluice-worker-scaler
  namespace: sluice
spec:
  scaleTargetRef:
    name: sluice-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        query: sum(sluice_queue_depth)
        threshold: "10"
