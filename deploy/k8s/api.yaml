apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluice-api
  namespace: sluice
  labels:
    app: sluice-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sluice-api
  template:
    metadata:
      labels:
        app: sluice-api
    spec:
      containers:
        - name: api
          image: ghcr.io/joshblazer/sluice:latest
          args: ["--role", "api"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sluice-config
            - secretRef:
                name: sluice-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sluice-api
  namespace: sluice
spec:
  selector:
    app: sluice-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
