# Credentials. Replace these example values (or create the Secret from your own
# secret store) before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: sluice-secrets
  namespace: sluice
type: Opaque
stringData:
  SLUICE_POSTGRES_URL: "postgres://sluice:CHANGE_ME@postgres:5432/sluice?sslmode=require"
  SLUICE_REDIS_ADDR: "redis://:CHANGE_ME@redis:6379/0"
