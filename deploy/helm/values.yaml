image:
  repository: ghcr.io/joshblazer/sluice
  # Defaults to the chart's appVersion, i.e. the release the chart shipped with.
  tag: ""
  pullPolicy: IfNotPresent

# Run database migrations (bundled in the image) as a pre-install/pre-upgrade
# hook. Disable if you manage the schema some other way.
migrations:
  enabled: true

# Credentials go into a Secret. To manage it yourself, create a Secret with keys
# SLUICE_POSTGRES_URL, SLUICE_REDIS_ADDR (and SLUICE_ETCD_PASSWORD if used) and
# name it here; postgres.url, redis.addr and etcd.password are then ignored.
existingSecret: ""

postgres:
  url: "postgres://sluice:sluice@postgres:5432/sluice?sslmode=disable"

redis:
  # host:port, or redis[s]://[user:pass@]host:port[/db] for auth, database and TLS.
  addr: "redis:6379"

etcd:
  endpoints: "etcd:2379"
  username: ""
  password: ""
  tls:
    # Name of a Secret holding ca.crt (and tls.crt/tls.key when clientCert is
    # true), mounted into scheduler pods to connect to etcd over TLS.
    secretName: ""
    clientCert: false

api:
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

scheduler:
  # Days to keep finished jobs, run history and dead letters (0 keeps everything).
  retentionDays: 30
  replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicas: 2
  shutdownTimeout: 45s
  concurrency: 10
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    queueDepthPerReplica: 10
    prometheusAddress: http://prometheus:9090
