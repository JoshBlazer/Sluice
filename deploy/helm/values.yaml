image:
  repository: sluice
  tag: latest
  pullPolicy: IfNotPresent

postgres:
  url: "postgres://sluice:sluice@postgres:5432/sluice?sslmode=disable"

redis:
  addr: "redis:6379"

etcd:
  endpoints: "etcd:2379"

api:
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

scheduler:
  # Days to keep finished jobs, run history and dead letters (0 keeps everything).
  retentionDays: 30
  replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicas: 2
  shutdownTimeout: 45s
  concurrency: 10
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    queueDepthPerReplica: 10
    prometheusAddress: http://prometheus:9090
