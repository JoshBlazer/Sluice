{{- if not .Values.existingSecret }}
# Connection strings and passwords live in a Secret, not the ConfigMap. Set
# existingSecret to supply your own (same keys) instead of values here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sluice.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sluice.labels" . | nindent 4 }}
  annotations:
    # A hook, created before the migration job (also a pre-install hook) so the
    # job can read the database URL on a first install.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  SLUICE_POSTGRES_URL: {{ .Values.postgres.url | quote }}
  SLUICE_REDIS_ADDR: {{ .Values.redis.addr | quote }}
  {{- with .Values.etcd.password }}
  SLUICE_ETCD_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
