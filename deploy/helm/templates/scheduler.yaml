apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sluice.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sluice.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: {{ include "sluice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--role", "scheduler"]
          ports:
            - name: metrics
              containerPort: 9091
          {{- include "sluice.envFrom" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with .Values.etcd.tls.secretName }}
          env:
            - name: SLUICE_ETCD_CA_FILE
              value: /etc/sluice/etcd-tls/ca.crt
            {{- if $.Values.etcd.tls.clientCert }}
            - name: SLUICE_ETCD_CERT_FILE
              value: /etc/sluice/etcd-tls/tls.crt
            - name: SLUICE_ETCD_KEY_FILE
              value: /etc/sluice/etcd-tls/tls.key
            {{- end }}
          volumeMounts:
            - name: etcd-tls
              mountPath: /etc/sluice/etcd-tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.etcd.tls.secretName }}
      volumes:
        - name: etcd-tls
          secret:
            secretName: {{ . }}
      {{- end }}
