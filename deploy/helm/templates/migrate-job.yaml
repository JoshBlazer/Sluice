{{- if .Values.migrations.enabled }}
# Applies the schema bundled in this image before any pod of the new version starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sluice.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sluice.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "sluice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/migrate", "-path", "/migrations", "-database", "$(SLUICE_POSTGRES_URL)", "up"]
          envFrom:
            - secretRef:
                name: {{ include "sluice.secretName" . }}
{{- end }}
