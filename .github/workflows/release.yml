name: Release

# Push a tag like v0.4.0 to publish:
#   - multi-arch (amd64, arm64) images to ghcr.io/joshblazer/sluice:<version> and :latest
#   - the Helm chart, versioned to match, attached to a GitHub Release
# Running it manually (workflow_dispatch) is a dry run: everything builds, nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.v.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.publish == 'true' }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/joshblazer/sluice:${{ steps.v.outputs.version }}
            ghcr.io/joshblazer/sluice:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package deploy/helm --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d dist

      - name: Create GitHub Release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "Sluice $GITHUB_REF_NAME"
