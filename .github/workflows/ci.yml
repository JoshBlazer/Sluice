name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sluice
          POSTGRES_PASSWORD: sluice
          POSTGRES_DB: sluice
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      etcd:
        image: quay.io/coreos/etcd:v3.5.16
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
        ports:
          - 2379:2379

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Vet
        run: go vet ./... && go vet -tags integration ./...

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Install migrate
        run: go install -tags 'pgx5' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: make migrate-up

      - name: Integration tests
        env:
          SLUICE_TEST_REQUIRE_INFRA: "1"
        run: go test ./... -race -count=1 -p 1 -tags integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sluice:ci --build-arg VERSION=ci .
      - name: Smoke test binaries
        run: |
          docker run --rm sluice:ci --role nope 2>&1 | grep -q 'unknown role'
          docker run --rm --entrypoint /sluice-cli sluice:ci 2>&1 | grep -q 'sluice-cli'
          docker run --rm sluice:ci --version
          docker run --rm --entrypoint /migrate sluice:ci -version
          docker run --rm --entrypoint /migrate sluice:ci -path /migrations -database 'postgres://x@127.0.0.1:1/x' version 2>&1 | grep -q 'connect'

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm
      - name: Render chart
        run: helm template sluice deploy/helm > /dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  kubernetes:
    # Installs the Helm chart on a throwaway kind cluster and runs a job through it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: sluice
      - name: Build and load image
        run: |
          docker build -t sluice:ci --build-arg VERSION=ci .
          kind load docker-image sluice:ci --name sluice
      - name: Smoke test
        run: scripts/k8s-smoke.sh

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check alert rules
        run: docker run --rm -v "$PWD/deploy:/deploy" --entrypoint promtool prom/prometheus:v2.51.2 check rules /deploy/helm/files/alerts.yml
      - name: Unit-test alert rules
        run: docker run --rm -v "$PWD/deploy:/deploy" -w /deploy/monitoring --entrypoint promtool prom/prometheus:v2.51.2 test rules alerts_test.yml
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@1 lint internal/api/openapi.yaml
